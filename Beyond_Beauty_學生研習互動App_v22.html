 {name:'支付與交通',items:[['p_cash','韓元現金'],['p_cc','信用卡／行動支付'],['p_tmoney','T-money 交通卡']]},
 {name:'研習與服裝',items:[['p_clothes','整潔得體的服裝'],['p_notetaking','筆記用品（紙筆、平板等）'],['p_shoes','適合步行的鞋款'],['p_coat','保暖外套與配件']]},
 {name:'電子設備',items:[['p_phone','手機、充電器與充電線'],['p_adapter','韓國插座轉接頭'],['p_internet','行動網路／網卡'],['p_powerbank','行動電源']]},
 {name:'其他用品',items:[['p_umbrella','折疊傘或輕便雨具']]}
];
const guideTabs=[['pack','行前檢查表'],['local','旅韓提醒'],['battery','行動電源'],['arrival','入境申報']];
function prepChecklist(){
  const items=prepChecklistGroups.flatMap(g=>g.items);
  const done=items.reduce((n,[id])=>n+Number(state.checked.has(id)),0);
  const pct=Math.round(done/items.length*100);
  return `<div class="guide-panel-header"><h2>行前攜帶物品</h2><span class="guide-progress">${done} / ${items.length} 已勾選</span></div><div class="guide-meter" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${items.length}" aria-label="行前檢查完成進度"><div class="guide-meter-fill" style="width:${pct}%"></div></div>${prepChecklistGroups.map(group=>`<section class="guide-category"><h3>${group.name}</h3><div class="guide-check-grid">${group.items.map(([id,label])=>`<button type="button" class="guide-check ${state.checked.has(id)?'is-done':''}" data-check="${id}" aria-pressed="${state.checked.has(id)}"><span class="check-box">${state.checked.has(id)?I('check'):''}</span><span class="check-text">${label}</span></button>`).join('')}</div></section>`).join('')}<div class="guide-note">勾選紀錄會自動保存在目前使用的瀏覽器中，請使用同一裝置與瀏覽器開啟。</div>`;
}
function localGuide(){return `<div class="guide-panel-header"><h2>旅韓提醒</h2></div><div class="guide-info-list"><section class="guide-info-item"><h3>T-money 交通卡</h3><p><strong>本次研習行程將搭乘市區巴士，因此需要使用 T-money 交通卡。</strong>請事先備妥交通卡及韓元現金，以利儲值與搭車。</p><ul><li>交通卡儲值請準備韓元現金。</li><li>搭乘公車時，上下車皆須刷卡。</li><li>刷卡後請確認讀卡機發出「嗶」聲並顯示卡片餘額。</li><li>下公車時，請由後門刷卡下車。</li></ul></section><section class="guide-info-item"><h3>冬季天氣與服裝</h3><p>12 月首爾天氣寒冷，室內外溫差較大，建議採分層穿搭，攜帶保暖外套、適合步行的鞋款及折疊傘或輕便雨具。</p><p>研習與參訪期間請穿著<strong>整潔、得體的服裝</strong>，無須特別準備正式或半正式服裝，避免過於隨意的穿著。</p><a class="guide-link" target="_blank" rel="noopener noreferrer" href="https://www.kma.go.kr/nchn/index.do">韓國氣象廳 ${I('arrow')}</a></section><section class="guide-info-item"><h3>電壓與轉接頭</h3><p>韓國使用 220V、60Hz 電源，常見插座為圓形雙孔。請確認手機、相機及其他電子設備的充電器是否支援當地電壓，並自行準備適用的轉接頭。</p></section></div>`;}
function batteryGuide(){return `<div class="guide-panel-header"><h2>行動電源與鋰電池</h2></div><p class="guide-panel-desc">搭乘飛機前，請確認航空公司與機場最新攜帶規定。</p><div class="guide-info-list"><section class="guide-info-item"><h3>攜帶方式與數量</h3><ul><li>行動電源及備用鋰電池<strong>不可託運</strong>，請放入隨身行李。</li><li>行動電源每人最多攜帶 <strong>2 個</strong>；實際攜帶限制仍以搭乘航空公司及機場規定為準。</li></ul></section><section class="guide-info-item"><h3>容量限制</h3><ul><li><strong>100Wh 以下：</strong>符合規定者可隨身攜帶。</li><li><strong>100–160Wh：</strong>須事先取得航空公司核准。</li><li><strong>超過 160Wh：</strong>禁止攜帶。</li></ul></section><section class="guide-info-item"><h3>短路防護</h3><ul><li>行動電源請以<strong>透明夾鏈袋個別包裝</strong>。</li><li>USB 孔及外露電源接點請使用<strong>絕緣膠帶</strong>做好防護。</li></ul><a class="guide-link" target="_blank" rel="noopener noreferrer" href="https://www.airport.kr/ap_en/1433/subview.do">仁川機場攜帶規定 ${I('arrow')}</a></section></div>`;}
function arrivalGuide(){return `<div class="guide-panel-header"><h2>韓國電子入境申報</h2></div><p class="guide-panel-desc">韓國電子入境申報卡（e-Arrival Card）可於<strong>入境前 72 小時內</strong>透過官方網站免費填寫。請依個人適用規定完成申報。</p><div class="guide-steps"><div class="guide-step"><span class="guide-step-num">1</span><div><b>進入官方網站</b><p>進入電子入境申報網站，選擇「個人申報」。</p></div></div><div class="guide-step"><span class="guide-step-num">2</span><div><b>同意條款並填寫電子郵件</b><p>依網站指示完成條款同意及電子郵件填寫。</p></div></div><div class="guide-step"><span class="guide-step-num">3</span><div><b>填寫護照資料</b><p>上傳或輸入護照資料，核對姓名、護照號碼及出生日期。</p></div></div><div class="guide-step"><span class="guide-step-num">4</span><div><b>填寫旅行資訊</b><p>填入入出境日期、航班及韓國住宿地址；<strong class="arrival-purpose-alert">入境目的請選擇「旅遊」。</strong></p></div></div><div class="guide-step"><span class="guide-step-num">5</span><div><b>確認提交並保存資料</b><p>核對內容後提交，保存 PDF、截圖或電子郵件確認資料。</p></div></div></div><div class="guide-link-stack"><a class="guide-link guide-link-official" target="_blank" rel="noopener noreferrer" href="https://www.e-arrivalcard.go.kr/portal/main/index.do?locale=CH">電子入境申報官方網站 ${I('arrow')}</a><a class="guide-link guide-link-tutorial" target="_blank" rel="noopener noreferrer" href="https://stellaclife.com/korea-earrival-card/">電子入境申報填寫教學 ${I('arrow')}</a></div><div class="guide-note">電子入境申報為免費服務，請認明官方網站。</div>`;}


const navs=[['schedule','calendar','行程'],['places','pin','地點'],['assignment','assignment','作業'],['notes','list','手冊']];
const state={view:'schedule',day:'6',query:null,modal:null,guideTab:'pack',placeTab:'traffic',assignmentTab:'p1',checked:new Set(load('bb_checks',[]))};
function load(key, fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch(_){return fallback}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify([...val]))}catch(_){}}
function placeLink(place){return places[place] ? mapSearch(places[place].map):''}
function formatDay(day){return `${days[day].short}（${days[day].weekday}）`}
function renderNavigation(){for(const elem of [E('desktop-nav'),E('bottom-nav')]){if(!elem)continue;const desktop=elem.id==='desktop-nav';elem.innerHTML=navs.map(([key,icon,label])=>`<button class="${desktop?'desktop-nav-btn':'bottom-btn'} ${state.view===key?'active':''}" data-view="${key}" aria-current="${state.view===key?'page':'false'}">${I(icon)}<span>${label}</span>${desktop?'':'<span class="bottom-dot"></span>'}</button>`).join('')}}
function dayTabs(){return `<div class="day-switch" role="tablist" aria-label="切換研習日期">${Object.entries(days).map(([key,d])=>`<button class="day-tab ${state.day===key?'active':''}" role="tab" aria-selected="${state.day===key}" data-day="${key}"><span class="day-num">${d.short}</span><span><strong>${d.weekday}</strong></span></button>`).join('')}</div>`}
function eventItems(day){return days[day].events.map(id=>{
  const e=events[id];
  const className=e.detail?'event-card course-event':(id==='d8c'?'event-card static-event meal-event':'event-card static-event');
  const cut=e.detail?e.title.indexOf('：'):-1;
  const category=cut>0?`<span class="event-type">${e.title.slice(0,cut)}</span>`:'';
  const heading=cut>0?e.title.slice(cut+1).trim():e.title;
  const speaker=e.speaker?`<div class="event-speaker">講師：<strong>${e.speaker}</strong></div>`:'';
  const venue=e.venue?`<div class="event-place">${I('pin')}${e.venue}</div>`:'';
  const details=e.detail?`<div class="event-card-actions"><button class="detail-button" data-event="${id}" aria-label="查看${e.title}課程詳情">課程詳情 ${I('chevron')}</button></div>`:'';
  return `<div class="event"><div class="time-col">${e.time.replace('–','<wbr>–')}</div><div class="event-rail"></div><article class="${className}">${category}<h3>${heading}</h3>${speaker}${venue}${details}</article></div>`;
}).join('')}

function placesPage(){
 const p=places.university;
 const tab=state.placeTab==='campus'?'campus':'traffic';
 const transport=`<div class="campus-transit-grid"><div class="campus-transit-card"><span class="campus-route-label">01</span><h3>搭乘地鐵與公車</h3><ol class="campus-route-steps"><li>搭乘地鐵<strong>4 號線</strong>至<strong>誠信女大站（Sungshin Women's Univ. Station）6 號出口</strong>。</li><li>步行至<strong>東大門阿里郎希爾酒店（Arirang Hill Hotel）</strong>前方公車站。</li><li>搭乘<strong>2115 號公車</strong>，於終點站<strong>西京大學（Seokyeong University）</strong>下車。</li></ol></div><div class="campus-transit-card"><span class="campus-route-label">02</span><h3>搭乘計程車</h3><p>請告訴司機在西京大學<strong>「北岳館」（Bugak-gwan／북악관）</strong>前方下車。</p></div></div><div class="campus-entry-note">${I('check')}<p>校門口及各棟建築物入口沒有警衛，無須辦理報到或登記手續，可直接進入校園。</p></div>`;
 const mapContent=`<div class="campus-map-panel"><div class="campus-map-icon">${I('map')}</div><h3>西京大學校園地圖</h3><a class="campus-map-link" target="_blank" rel="noopener noreferrer" href="https://www.skuniv.ac.kr/campus-map?utm_source=chatgpt.com">${I('arrow')} 開啟校園地圖</a></div>`;
 return `<h1 class="page-title">研習地點</h1>
 <div class="location-list"><article class="content-card place-card location-card">
   <img class="photo" src="${p.photo}" alt="西京大學校園" loading="lazy">
   <div class="card-body"><span class="course-num">${p.en}</span>
     <div class="location-title-row"><h3>${p.name}</h3>
       <a class="location-nav" target="_blank" rel="noopener noreferrer" href="${placeLink('university')}">${I('pin')}<span>導航</span></a>
     </div>
   </div>
 </article></div>
 <section class="campus-guide" aria-label="西京大學交通與校園地圖">
   <div class="campus-mode-tabs" role="tablist" aria-label="西京大學資訊切換">
     <button type="button" class="campus-mode-tab ${tab==='traffic'?'active':''}" role="tab" aria-selected="${tab==='traffic'}" data-place-tab="traffic">交通方式</button>
     <button type="button" class="campus-mode-tab ${tab==='campus'?'active':''}" role="tab" aria-selected="${tab==='campus'}" data-place-tab="campus">校園地圖</button>
   </div>
   <div class="campus-mode-content" role="tabpanel" aria-label="${tab==='traffic'?'交通方式':'校園地圖'}">${tab==='traffic'?transport:mapContent}</div>
 </section>`;
}
function notesPage(){
 const panels={pack:prepChecklist,local:localGuide,battery:batteryGuide,arrival:arrivalGuide};
 const tab=panels[state.guideTab]?state.guideTab:'pack';

}

      {title:'政府政策資金與企業評估',items:[
        '具備豐富的政府政策資金籌措經驗。',
        '曾擔任政府基金管理機構的企業價值評估委員。'
      ]}
    ]
  }
};
const hospitalProfile={
  intro:'ID Hospital 為韓國綜合醫學美容機構，提供整形外科、皮膚科及牙科等醫療服務。',
  sections:[
    {title:'參訪重點',items:['了解皮膚科臨床護膚諮詢與院區服務流程。','觀察智慧診斷技術、顧客諮詢與醫學美容服務體驗。','認識整合式醫美服務流程與營運模式。']}
  ]
};
function profileMarkup(profile){
  if(!profile)return '';
  return `<div class="bio-section">${profile.current?`<div class="bio-current"><span>現職：</span><strong>${profile.current}</strong></div>`:''}${profile.intro?`<p class="bio-lead">${profile.intro}</p>`:''}${profile.sections.map(s=>`<section class="bio-part"><h3>${s.title}</h3><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('')}</div>`;
}
function modalInfo(){
  if(!state.modal)return null;
  const e=events[state.modal];
  if(!e||!e.detail)return null;
  return {title:e.title,enTitle:e.enTitle||'',speaker:e.speaker||'',desc:e.note||'',bullets:e.bullets||[],profile:e.speaker?speakerProfiles[e.speaker]:hospitalProfile,isVisit:!e.speaker};
}
function detailPanelMarkup(){
  const d=modalInfo(); if(!d)return '';
  if(state.detailTab==='bio')return profileMarkup(d.profile);
  return `<section class="course-core">${d.desc?`<p class="modal-paragraph">${d.desc}</p>`:''}${d.bullets?.length?`<ul class="detail-bullets">${d.bullets.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</section>`;
}
function renderDetailModal(){
  const d=modalInfo();if(!d)return;
  const secondTitle=d.isVisit?'參訪單位':'講師介紹';
  E('modal-host').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal ref-detail-modal" role="dialog" aria-modal="true" aria-label="${d.title}"><button class="modal-close" data-action="close-modal" aria-label="關閉詳情">${I('close')}</button><div class="modal-head"><h2>${d.title}</h2>${d.enTitle?`<p class="modal-topic-en">${d.enTitle}</p>`:''}${d.speaker?`<p class="modal-speaker">講師：<strong>${d.speaker}</strong></p>`:''}</div><div class="modal-content"><div class="detail-tabs" role="tablist" aria-label="詳情頁面"><button class="detail-tab ${state.detailTab==='core'?'active':''}" role="tab" aria-selected="${state.detailTab==='core'}" data-detail-tab="core">課程核心</button><button class="detail-tab ${state.detailTab==='bio'?'active':''}" role="tab" aria-selected="${state.detailTab==='bio'}" data-detail-tab="bio">${secondTitle}</button></div><div class="detail-tab-panel" id="detail-tab-panel" role="tabpanel">${detailPanelMarkup()}</div></div></section></div>`;
  document.body.style.overflow='hidden';
}
function showEvent(id){
  const e=events[id];if(!e||!e.detail)return;
  state.modal=id;state.detailTab='core';renderDetailModal();
}
function selectDetailTab(tab){
  if(!state.modal || (tab!=='core' && tab!=='bio'))return;
  state.detailTab=tab;
  for(const el of document.querySelectorAll('.detail-tab')){
    const active=el.dataset.detailTab===tab;
    el.classList.toggle('active',active);
    el.setAttribute('aria-selected',String(active));
  }
  const panel=E('detail-tab-panel');if(panel)panel.innerHTML=detailPanelMarkup();
}
function closeModal(){E('modal-host').innerHTML='';state.modal=null;document.body.style.overflow=''}
let toastTimer=0;function toast(msg){const el=E('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function setView(view){if(!navs.some(([key])=>key===view))return;state.view=view;state.query=null;E('searchbar').hidden=true;render();scrollTo({top:0,behavior:'smooth'})}
async function share(){if(location.protocol==='file:'){toast('部署後即可分享網站連結');return}const shareData={title:'2026 Beyond Beauty｜韓國研習手冊',text:'12/6–12/8 學生研習行程',url:location.href.split('#')[0]};try{if(navigator.share){await navigator.share(shareData);return}if(navigator.clipboard){await navigator.clipboard.writeText(shareData.url);toast('已複製網站連結');return}toast('請複製瀏覽器網址分享')}catch(err){if(err.name!=='AbortError')toast('請複製瀏覽器網址分享')}}
document.addEventListener('click',ev=>{const node=ev.target.closest('[data-view],[data-day],[data-event],[data-detail-tab],[data-guide-tab],[data-place-tab],[data-assignment-tab],[data-check],[data-action]');if(!node){if(ev.target.classList.contains('modal-backdrop'))closeModal();return}
if(node.dataset.view){setView(node.dataset.view);return}
if(node.dataset.day){state.day=node.dataset.day;render();return}
if(node.dataset.event){showEvent(node.dataset.event);return}
if(node.dataset.detailTab){selectDetailTab(node.dataset.detailTab);return}
if(node.dataset.guideTab){state.guideTab=node.dataset.guideTab;render();return}
if(node.dataset.placeTab){state.placeTab=node.dataset.placeTab;render();return}
if(node.dataset.assignmentTab){state.assignmentTab=node.dataset.assignmentTab;render();return}
if(node.dataset.check){let id=node.dataset.check;if(state.checked.has(id))state.checked.delete(id);else state.checked.add(id);save('bb_checks',state.checked);render();return}
const action=node.dataset.action;if(action==='search'){state.query='';E('searchbar').hidden=false;render();E('search-input').focus();return}if(action==='close-search'){state.query=null;E('searchbar').hidden=true;render();return}if(action==='share'){share();return}if(action==='close-modal'){closeModal();return}if(action==='backdrop'&&ev.target===node){closeModal();return}});
document.addEventListener('input',ev=>{if(ev.target.id==='search-input'){state.query=ev.target.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal)closeModal()});
render();
if(false&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script>
</body>
</html>
